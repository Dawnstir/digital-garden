<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Garden</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/monet-theme.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
  <!-- 顶部导航：几乎隐形 -->
  <header class="site-header glass">
    <div class="container">
      <span class="site-title">Digital Garden</span>
      <a href="/admin/" style="font-size:13px;color:var(--color-text-muted);">Admin</a>
    </div>
  </header>

  <main class="container">
    <!-- 今日单词：打开直接看到 -->
    <section class="hero-words">
      <div class="label">Today</div>
      <div class="number" id="word-count">0</div>
      <div class="unit">words</div>
      <div class="streak" id="word-streak">连续打卡 0 天</div>
    </section>

    <!-- 日记流：时间倒序 -->
    <section class="diary-stream">
      <div class="section-title">Recent Entries</div>
      <div id="diary-list">
        <!-- JS 会在这里填充日记 -->
        <div class="diary-item">
          <div class="date">2026-07-27</div>
          <div class="title">占位日记标题</div>
          <div class="excerpt">骨架已搭好，等待真实数据填充...</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
