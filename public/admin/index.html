<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Digital Garden</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/monet-theme.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <!-- 成功提示 -->
  <div id="toast" class="toast">发布成功 🌿</div>

  <div class="admin-card glass">
    <h1>🌿 Admin</h1>
    
    <!-- PIN 登录 -->
    <div id="login-section">
      <div class="field">
        <input type="password" id="pin-input" class="input pin-input" placeholder="••••" maxlength="6">
      </div>
      <button id="login-btn" class="btn btn-publish">进入后台</button>
    </div>

    <!-- 编辑器 -->
    <div id="editor-section" style="display:none;">
      <!-- 标题 -->
      <div class="field">
        <label>标题（可选）</label>
        <input type="text" id="title-input" placeholder="今天发生了什么？">
      </div>

      <!-- 单词数量 -->
      <div class="field">
        <label>今日单词数量</label>
        <input type="number" id="word-input" placeholder="0" min="0">
      </div>

      <!-- 日记内容 -->
      <div class="field">
        <label>今日日记</label>
        <textarea id="diary-input" placeholder="写点什么... 支持 Markdown"></textarea>
        <div class="char-count"><span id="char-count">0</span> 字</div>
      </div>

      <button id="publish-btn" class="btn btn-publish">发布</button>
    </div>
  </div>
  
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
